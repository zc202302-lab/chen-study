name: Phase1 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check server.mjs
      - run: bash -n scripts/bootstrap.sh scripts/connect-caddy.sh scripts/verify-db.sh
      - run: docker build -t chen-study-probe:check .
